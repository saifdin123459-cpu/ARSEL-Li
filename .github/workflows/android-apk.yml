name: Build ERSEL LI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q ERSEL_LI_GitHub_Build_download.zip -d source

      - name: Build APK
        run: gradle -p source/ersel_li_connected assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ERSEL-LI-APK
          path: source/ersel_li_connected/app/build/outputs/apk/debug/app-debug.apk
